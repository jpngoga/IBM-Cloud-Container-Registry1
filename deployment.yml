
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook
  template:
    metadata:
      labels:
        app: guestbook
    spec:
      containers:
        - name: guestbook
          image: us.icr.io/sn-labs-jpngoga/guestbook:v2
          env:
            - name: APP_VERSION
              value: "v2"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 2m
            limits:
              cpu: 5m
